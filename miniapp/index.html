<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#F5F0E8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>MiniMe Dashboard</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F5F0E8;
      color: #2D2D2D;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="debug" style="padding:16px;font-family:monospace;font-size:12px;color:#333;background:#fff8;position:fixed;bottom:0;left:0;right:0;max-height:40vh;overflow:auto;display:none;z-index:9999"></div>
  <script>
    function dbg(msg) {
      var d = document.getElementById('debug');
      d.style.display = 'block';
      d.innerHTML += '<div>' + msg + '</div>';
    }
    window.onerror = function(msg, src, line, col, err) {
      dbg('ERROR: ' + msg + ' (' + src + ':' + line + ')');
    };
    window.onunhandledrejection = function(e) {
      dbg('PROMISE: ' + (e.reason && e.reason.message || e.reason || 'unknown'));
    };
    // Check if React mounted after 3 seconds
    setTimeout(function() {
      var root = document.getElementById('root');
      if (!root || root.children.length === 0) {
        dbg('ROOT EMPTY after 3s — React did not mount');
        dbg('TG: ' + (window.Telegram ? 'SDK loaded' : 'SDK missing'));
        dbg('URL: ' + window.location.href);
      }
    }, 3000);
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
