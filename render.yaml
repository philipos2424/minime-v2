services:
  - type: web
    name: minime-v2
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PLATFORM_ADMIN_TELEGRAM_ID
        sync: false
      - key: ENABLE_SHADOW_MODE
        value: "true"
      - key: ENABLE_REFERRALS
        value: "true"
      - key: FALLBACK_TIMEOUT_MINUTES
        value: "30"
